<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020b16">
  <title>VaryCave SportsCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="v6.css?v=6.0">
</head>
<body>
  <div class="boot-screen" id="bootScreen"><img src="assets/varycreative-mark.svg" alt="VaryCreative"><span>CONNECTING LIVE SPORTS</span></div>
  <main class="dashboard" id="dashboard">
    <header class="masthead">
      <div class="brand"><img src="assets/varycreative-mark.svg" alt="VaryCreative"><div><h1>VARYCAVE <b>SPORTSCENTER</b></h1><span id="date">DALLAS · CT</span></div></div>
      <div class="system-status"><span><i></i><b id="dataStatus">CONNECTING · CT</b></span><time id="clock">--:--</time></div>
    </header>

    <nav class="league-nav" id="sportStrip" aria-label="Select a league"></nav>

    <section class="command-stage">
      <article class="spotlight" id="spotlight">
        <div class="spotlight-photo" id="heroPhoto"></div>
        <div class="spotlight-shade"></div>
        <div class="spotlight-content">
          <header class="spotlight-head">
            <div class="spotlight-league" id="heroLeague"></div>
            <div><span id="heroStatus">UPCOMING</span><b id="heroNetwork"></b></div>
          </header>
          <div class="spotlight-title"><span id="featureLabel">FEATURED MATCHUP</span><h2 id="heroTitle">LIVE SPORTS</h2></div>
          <div class="matchup">
            <div class="club"><div class="club-logo" id="awayMark"></div><strong id="awayName">AWAY</strong><span id="awayCode"></span></div>
            <div class="game-center"><span id="gameMeta">STARTS</span><b id="score">--</b><small id="venue"></small></div>
            <div class="club"><div class="club-logo" id="homeMark"></div><strong id="homeName">HOME</strong><span id="homeCode"></span></div>
          </div>
          <div class="markets" id="heroOdds"></div>
        </div>
      </article>

      <aside class="watch-panel">
        <header><div><span id="watchLeague">NFL</span><h2>SIX TO WATCH</h2></div><b>LIVE + NEXT</b></header>
        <div class="watch-list" id="watchList"></div>
      </aside>
    </section>

    <section class="live-board"><div class="live-board-label"><span>VARYCAVE</span><b>LIVE BOARD</b></div><div class="live-board-window"><div class="live-board-track" id="arenaRibbon"></div></div></section>

    <section class="ticker-stack" id="tickerStack" aria-label="NFL, NCAA Top 25, and MLB score tickers"></section>

    <footer><span>LIVE SCOREBOARD · CENTRAL TIME</span><span id="lastUpdate">UPDATING</span><span>ODDS INFORMATIONAL ONLY</span></footer>
  </main>
  <script src="config.js?v=6.0"></script>
  <script src="assets.js?v=6.0"></script>
  <script src="data-client.js?v=6.0"></script>
  <script>Promise.resolve(window.SPORTS_DATA_READY).finally(function(){var s=document.createElement('script');s.src='v6-app.js?v=6.0';document.body.appendChild(s)});</script>
</body>
</html>
