<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaryCave Live Setup</title><style>body{margin:0;background:#001a33;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(620px,88vw);background:#00274c;border:2px solid #ffcb05;padding:28px;border-radius:18px;box-shadow:0 30px 80px #0008}h1{margin:0 0 8px;color:#ffcb05}p{line-height:1.5;color:#dce6f2}label{display:block;font-weight:700;margin:22px 0 8px}input{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;border:1px solid #7f94aa;background:#061525;color:#fff;font-size:16px}button,a{display:inline-block;margin-top:16px;padding:12px 18px;border:0;border-radius:8px;background:#ffcb05;color:#00274c;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#dce6f2;margin-left:8px}.status{margin-top:18px;padding:12px;background:#061525;border-radius:8px;min-height:22px}</style></head><body><main class="card"><h1>VaryCave Live Data</h1><p>Paste the deployed Cloudflare Worker URL below. It is stored only in this browser, so configure it once on the iPad and once on the Raspberry Pi.</p><label for="worker">Worker URL</label><input id="worker" placeholder="https://varycave-sports-live.your-subdomain.workers.dev"><button id="save">Save & Test</button><a class="secondary" href="./">Open Dashboard</a><div class="status" id="status">No test run yet.</div></main><script>const input=document.getElementById('worker'),status=document.getElementById('status');input.value=localStorage.getItem('varycave-worker-url')||'';document.getElementById('save').onclick=async()=>{const base=input.value.trim().replace(/\/$/,'');if(!base){status.textContent='Enter a Worker URL.';return}status.textContent='Testing live gateway…';try{const r=await fetch(base+'/health',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();localStorage.setItem('varycave-worker-url',base);status.textContent='Connected: '+d.service+'. Open the dashboard.'}catch(e){status.textContent='Could not connect: '+e.message}};</script></body></html>
