<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111e">
  <title>VaryCave SportsCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="command-center.css?v=6.9">
  <link rel="stylesheet" href="compact-dashboard.css?v=7.1">
</head>
<body>
  <div class="boot-screen" id="bootScreen">
    <img src="assets/varycave-glass-vc.png" alt="VaryCave VC">
    <div><strong>VaryCave</strong><span>SportsCenter</span><small>BUILDING YOUR BOARD</small></div>
  </div>
  <main class="dashboard" id="dashboard" aria-live="polite"></main>
  <script src="config.js?v=6.9"></script>
  <script src="assets.js?v=6.8"></script>
  <script src="mock-data.js?v=6.8"></script>
  <script src="data-client.js?v=7.2"></script>
  <script>
    Promise.resolve(window.SPORTS_DATA_READY).finally(function () {
      var script = document.createElement('script');
      script.src = 'command-center.js?v=7.2';
      script.onerror = function () {
        document.getElementById('bootScreen')?.remove();
        document.getElementById('dashboard').innerHTML = '<p class="fatal-state">The dashboard could not start. Refresh to try again.</p>';
      };
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
